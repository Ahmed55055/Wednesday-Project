<html>
<head>
    <title>CineMax - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="./styles/home.css">
    <link rel="stylesheet" href="./styles/global.css">
</head>
<body>
<nav-movie page="home"></nav-movie>
<section id="hero" class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content" id="heroContent">
        <div class="hero-skeleton">Loading featured movie...</div>
    </div>
</section>

<main class="container px-3 px-md-4 px-lg-5 movies-main">

    <section class="movies-section">
        <div class="header">
            <h2 class="section-title">Trending Now</h2>
            <a href="#" class="see-all">See All</a>
        </div>
        <div id="trendingRow" class="movies-grid">
            <div class="row-skeleton">Loading trending movies...</div>
        </div>
    </section>

    <section class="movies-section">
        <div class="header">
            <h2 class="section-title">Top Rated Movies</h2>
            <a href="#" class="see-all">See All</a>
        </div>
        <div id="topRatedRow" class="movies-grid">
            <div class="row-skeleton">Loading top rated movies...</div>
        </div>
    </section>

</main>

<script src="./script/home.js"></script>
<script type="module" src="./components/navbar/script.js"></script>
</body>
</html>
