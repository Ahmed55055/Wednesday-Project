<html>
<head>
    <title>CineMax - Profile</title>
    <script src="../styles/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body>
    <nav-movie page="profile"></nav-movie>  
    <section class="profile-header">
        <div class="profile-header-container">
      
            <div class="profile-picture-wrapper">
             <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/9568/9568643.png" class="profile-image" alt="Profile Picture">
             <label  for="profileImageInput" class="change-photo" title="Change profile photo">   <i class="bi bi-camera-fill"></i>  </label>
             <input type="file" id="profileImageInput"  accept="image/*" class="d-none">
            </div>

            <div class="profile-info">
                <h1 id="profileUsername" class="profile-username"> </h1>
                <p  id="profileEmail" class="profile-email">  </p>
            </div>

        </div>

    </section>

    <main class="container profile-main">
        <div class="row">

            <aside class="col-12 col-lg-4">

                <div class="custom-card">
                    <h2 class="section-title">   Your Activity </h2>
                    <div class="row">
                        
                        <div class="stat-box col-4">
                            <strong id="watchedCount"> 0 </strong>
                            <span> WATCHED</span>
                        </div>

                        <div class="col-4">
                           <button  id="favoritesBtn"  type="button" class="stat-box stat-button w-100">
                              <strong id="favoritesCount"> 0 </strong>
                              <span>  FAVORITES </span>
                            </button>
                        </div>

                        <div class="stat-box col-4">
                            <strong id="reviewsCount"> 0 </strong>
                            <span> REVIEWS </span>
                        </div>

                    </div>

                </div>

                <button  id="logoutBtn"  type="button"  class="btn logout-btn w-100 mt-3">
                   <i class="bi bi-box-arrow-right me-2"></i>
                     Sign Out
                </button>

            </aside>


            <section class="col-12 col-lg-8">
                <div class="custom-card">

                    <div class="settings-section">
                        <h2 class="settings-title"> Account Settings </h2>

                        <div class="mb-3">
                            <label for="country" class="form-label"> Country </label>
                            <select id="country" class="form-select">
                                <option value="">  Select your country </option>
                                <option value="Egypt">  Egypt </option>
                                <option value="United States"> United States </option>
                                <option value="United Kingdom"> United Kingdom </option>
                                <option value="France"> France </option>
                                <option value="Germany"> Germany </option>
                                <option value="Canada">  Canada </option>
                                <option value="Saudi Arabia"> Saudi Arabia </option>
                                <option value="United Arab Emirates"> United Arab Emirates </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label"> Username </label>
                            
                            <div class="input-group">
                                <span class="input-group-text"> @ </span>
                                <input  type="text" id="username"  class="form-control" placeholder="Enter your username" autocomplete="off">
                            </div>

                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label"> Email Address </label>
                            <input type="email" id="email" class="form-control"  placeholder="Email address">
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6">
                                <label for="currentPassword" class="form-label"> Current Password </label>
                                <div class="password-wrapper">
                                    <input   type="password" id="currentPassword"  class="form-control"  placeholder="Current password">

                                    <button type="button" class="password-btn" onclick="togglePassword('currentPassword', this)" aria-label="Show current password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                            </div>

                            <div class="col-12 col-md-6">
                                <label for="newPassword" class="form-label"> New Password </label>
                                <div class="password-wrapper">
                                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password">

                                    <button type="button" class="password-btn" onclick="togglePassword('newPassword', this)" aria-label="Show new password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-end align-items-stretch align-items-sm-center gap-2 mt-4 pt-3 border-top save-area">
                        <button id="discardBtn" type="button" class="btn discard-btn"> Discard Changes</button>
                        <button id="saveBtn" type="button" class="btn save-btn">
                            <i class="bi bi-check-lg me-1"></i>
                            Save Changes
                        </button>
                    </div>

                </div>

            </section>

        </div>

    </main>

    <script src="profile.js"></script>
    <script type="module" src="../components/navbar/script.js"></script>
</body>
</html>
