<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax - Movie Details</title>
    <script src="../styles/theme.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/global.css">
    <style>
        .details-hero {
            position: relative;
            min-height: 400px;
            background-size: cover;
            background-position: center top;
            display: flex;
            align-items: flex-end;
        }
        .details-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent 30%, var(--bg-primary));
        }
        .details-content {
            position: relative;
            z-index: 1;
            padding: 40px 0;
        }
        .details-poster {
            width: 220px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .details-meta span {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .genre-badge {
            background: var(--bg-tertiary);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin: 2px;
        }
        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: var(--accent);
        }
        .loading-text {
            color: var(--text-muted);
            text-align: center;
            padding: 100px 20px;
        }
    </style>
</head>
<body>
    <nav-movie page="movies"></nav-movie>

    <div id="loading" class="loading-text">Loading movie details...</div>
    <div id="details" style="display:none;"></div>

    <script type="module" src="../components/navbar/script.js"></script>
    <script type="module" src="../script/movie-details.js"></script>
</body>
</html>
