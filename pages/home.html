<html>
<head>
    <title>CineMax - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>
     <nav class="navbar navbar-dark bg-cinemax py-2">
    <div class="container-fluid page-container d-flex align-items-center justify-content-between flex-nowrap">

      <!-- 1. Logo Group -->
      <a class="navbar-brand d-inline-flex align-items-center gap-2 m-0" href="#">
        <img src="https://raw.githubusercontent.com/Ahmed55055/Wednesday-Project/e7c98cf39bc3d80672846c1cd983b821b2392038/asset/logo-badge.svg" alt="CineMax Logo">
        <div class="text-white fw-bold fs-4 font-outfit">
          CINE<span class="max-color">MAX</span>
        </div>
      </a>

      <!-- 2. Pages Group (Always Visible) -->
      <ul class="navbar-nav flex-row gap-2 gap-sm-3 gap-md-4 gap-lg-5 mx-auto mb-0">
        <li class="nav-item">
          <a class="nav-link" data-page="home" href="home.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="movies" href="../../pages/movies.html">Movies</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="tv-shows" href="#">TV Shows</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="favorites" href="#">Favorites</a>
        </li>
      </ul>

      <!-- 3. Search Bar Group -->
      <div class="search-box position-relative">
        <!-- Icon Button for Small Devices -->
        <button class="btn btn-link text-white p-2 d-md-none border-0 search-toggle-btn" type="button">
          <i class="bi bi-search fs-5"></i>
        </button>

        <!-- Expandable Search Input -->
        <div class="search-input-wrapper">
          <input type="search" class="form-control form-control-sm search-input bg-dark text-white border-secondary"
            placeholder="Search titles, people..." aria-label="Search">
          <i class="bi bi-search search-icon text-white-50 d-none d-md-block"></i>
        </div>
      </div>

    </div>
  </nav>
    <section id="hero" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content" id="heroContent">
            <div class="hero-skeleton">Loading featured movie...</div>
        </div>
    </section>

    <main class="container px-3 px-md-4 px-lg-5 movies-main">

        <section class="movies-section">
            <div class="header">
                <h2 class="section-title">Trending Now</h2>
                <a href="#" class="see-all">See All</a>
            </div>
            <div id="trendingRow" class="movies-grid">
                <div class="row-skeleton">Loading trending movies...</div>
            </div>
        </section>

        <section class="movies-section">
            <div class="header">
                <h2 class="section-title">Top Rated Movies</h2>
                <a href="#" class="see-all">See All</a>
            </div>
            <div id="topRatedRow" class="movies-grid">
                <div class="row-skeleton">Loading top rated movies...</div>
            </div>
        </section>

    </main>

    <script src="home.js"></script>
</body>
</html>
