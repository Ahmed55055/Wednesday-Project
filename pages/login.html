<html>

<head>
    <title>CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="login.css">
</head>

<body>


  <nav class="navbar navbar-dark bg-cinemax py-2">
    <div class="container-fluid page-container d-flex align-items-center justify-content-between flex-nowrap">

      <!-- 1. Logo Group -->
      <a class="navbar-brand d-inline-flex align-items-center gap-2 m-0" href="#">
        <img src="https://raw.githubusercontent.com/Ahmed55055/Wednesday-Project/dc5a9596510b67d6854617c9201eaedc14bad6e7/asset/logo-badge.svg" alt="CineMax Logo">
        <div class="text-white fw-bold fs-4 font-outfit">
          CINE<span class="max-color">MAX</span>
        </div>
      </a>
  </nav>


<button id="themeToggle" class="theme-toggle" type="button">☀️</button>

    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="card  col-12 col-sm-10 col-xl-6">
            <div id="login">

                <div class="text-center mb-4">
                    <h1 class="fw-bold text-white mb-2">    Welcome Back </h1>
                    <p class="text-secondary"> Login to your CineMax account </p>
                </div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="loginEmail"  class="form-label text-light" > Email Address</label>
                        <input  type="email"  class="form-control form-control-lg"  id="loginEmail" placeholder="Enter your email" autocomplete="off" >
                    </div>

                    <div class="mb-3">
                        <label for="loginPassword" class="form-label text-light" > Password </label>
                        <input  type="password"  class="form-control form-control-lg"  id="loginPassword" placeholder="Enter your password" >
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-secondary"  for="rememberMe"> Remember me </label>
                    </div>

                    <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold" > Login</button>
                </form>


                <div class="text-center mt-4">
                    <span class="text-secondary"> Don't have an account?</span>
                    <button type="button" id="showRegister" class="btn btn-link text-danger fw-bold text-decoration-none" > Create Account</button>
                </div>

            </div>

            <!-- REGISTER -->

            <div id="register" style="display: none;">
                <div class="text-center mb-4">
                    <h1 class="fw-bold  mb-2">  Create Account  </h1>
                    <p class="text-secondary mb-0">   Create your CineMax account  </p>
                </div>

                <form id="registerForm">

                    <div class="mb-3">
                        <label for="registerName" class="form-label text-light" > Full Name</label>
                        <input   type="text"  class="form-control form-control-lg" id="registerName" placeholder="Enter your name" autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label  for="registerEmail" class="form-label text-light"> Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="registerEmail" placeholder="Enter your email" autocomplete="new-email" name="registerEmail_no_autofill">
                    </div>

                    <div class="mb-3">
                        <label for="registerPassword" class="form-label text-light" > Password </label>
                        <input  type="password"  class="form-control form-control-lg"  id="registerPassword"  placeholder="Create a password" >
                    </div>
                   

                    <div class="mb-3">
                        <label for="registerConfirmPassword" class="form-label text-light"> Repeat Password </label>
                        <input type="password"  class="form-control form-control-lg"   id="registerConfirmPassword"   placeholder="Repeat your password">
                    </div>

                    <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold" > Register </button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-secondary">Already have an account? </span>
                    <button  type="button"  id="showLogin"  class="btn btn-link text-danger fw-bold text-decoration-none" >  Login  </button>
                </div>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
